<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naufal — 3D Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="loading">
    <div class="loader"></div><span>LOADING WORLD...</span>
  </div>

  <div id="hud">
    <div class="brand">NAUFAL<span>.</span></div>
    <div class="hint">WASD / ARROW KEYS TO DRIVE · SPACE TO BRAKE</div>
  </div>

  <div id="crosshair">+</div>

  <div id="info" class="hidden">
    <button id="closeInfo">×</button>
    <div id="infoContent"></div>
  </div>

  <div id="mobileHint">Desktop recommended for the full experience.</div>

  <script type="module" src="./main.js"></script>
</body>

</html>
